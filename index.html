<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>поддержка разработчику</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h2 {
            margin-bottom: 20px;
            color: #333;
        }
        .price-box {
            margin: 20px 0;
            font-size: 18px;
            color: #444;
        }
        /* NEW */
        .amount-selector {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .amount-btn {
            padding: 8px 12px;
            border: 1px solid #ff8c00;
            background: white;
            color: #ff8c00;
            border-radius: 5px;
            cursor: pointer;
        }
        .amount-btn.active {
            background: #ff8c00;
            color: white;
        }
        input[type="number"] {
            width: 100px;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        /* END NEW */
        .price {
            font-weight: bold;
            color: #28a745;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #ff8c00;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        button:hover:not(:disabled) {
            background-color: #e07b00;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>поддержка разработчику</h2>
        
        <!-- NEW -->
        <div class="amount-selector">
            <button class="amount-btn" data-amount="49.99">49.99</button>
            <button class="amount-btn" data-amount="50.00">50.00</button>
            <button class="amount-btn" data-amount="100.00">100.00</button>
            <input type="number" id="customAmount" placeholder="Своя сумма">
        </div>
        <!-- END NEW -->
        
        <div class="price-box">
            поддержка разработчика за <span class="price" id="displayAmount">49.99</span> ₽
        </div>

        <button id="payButton">поддержать разработчика</button>
    </div>

    <script>
        const payButton = document.getElementById('payButton');
        const customAmount = document.getElementById('customAmount'); // NEW
        const displayAmount = document.getElementById('displayAmount'); // NEW
        let currentAmount = "49.99"; // CHANGED

        // NEW: Принудительно убираем подсветку со всех кнопок при загрузке страницы
        document.querySelectorAll('.amount-btn').forEach(b => b.classList.remove('active'));

        // NEW: Функция для обновления выбранной суммы и подсветки
        function updateSelection(amount, clickedElement = null) {
            currentAmount = amount;
            displayAmount.textContent = amount;
            
            document.querySelectorAll('.amount-btn').forEach(b => b.classList.remove('active'));
            
            if (clickedElement) {
                clickedElement.classList.add('active');
            }
        }

        // NEW: Логика клика по кнопкам выбора суммы
        document.querySelectorAll('.amount-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                updateSelection(btn.getAttribute('data-amount'), btn);
                customAmount.value = '';
            });
        });

        // NEW: Логика ручного ввода суммы
        customAmount.addEventListener('input', () => {
            if (customAmount.value > 0) {
                updateSelection(customAmount.value);
            }
        });

        // Обработка клика по кнопке оплаты
        payButton.addEventListener('click', async () => {
            payButton.disabled = true;
            payButton.textContent = "Создание платежа...";

            try {
                const response = await fetch('/api/pay', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        amount: currentAmount, // CHANGED
                        description: "поддержка разработчика",
                        returnUrl: "https://yookassaproj201514.vercel.app/success"
                    })
                });

                const data = await response.json();

                if (response.ok && data.confirmation_url) {
                    window.location.href = data.confirmation_url;
                } else {
                    alert('Ошибка создания платежа: ' + (data.error || 'Неизвестная ошибка'));
                    payButton.disabled = false;
                    payButton.textContent = "поддержать разработчика";
                }
            } catch (error) {
                console.error('Ошибка сети:', error);
                alert('Произошла ошибка при соединении с сервером.');
                payButton.disabled = false;
                payButton.textContent = "поддержать разработчика";
            }
        });
    </script>
</body>
</html>
