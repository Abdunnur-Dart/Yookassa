<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>поддержка разработчику</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h2 {
            margin-bottom: 20px;
            color: #333;
        }
        .status-box {
            margin-bottom: 20px;
            padding: 15px;
            border-radius: 5px;
            background: #eef2f7;
            color: #0056b3;
            font-weight: bold;
        }
        .price-box {
            margin: 20px 0;
            font-size: 18px;
            color: #444;
        }
        .price {
            font-weight: bold;
            color: #28a745;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #ff8c00;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        button:hover:not(:disabled) {
            background-color: #e07b00;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>поддержка разработчику</h2>
        
        <div id="authStatus" class="status-box">
            Проверка авторизации...
        </div>

        <div class="price-box">
           поддержка разработчика за <span class="price">49.99 ₽</span>
        </div>

        <button id="payButton" disabled>поддержать разработчика</button>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let userIdFromApp = urlParams.get('user_id');
        let appReturnUrl = urlParams.get('app_return');

        const authStatusElement = document.getElementById('authStatus');
        const payButton = document.getElementById('payButton');

        // Если параметры переданы в URL (первый вход из приложения), сохраняем их в localStorage
        if (userIdFromApp) {
            localStorage.setItem('saved_user_id', userIdFromApp);
            if (appReturnUrl) {
                localStorage.setItem('saved_app_return', appReturnUrl);
            }
        } else {
            // Если параметров нет (вернулись с ЮKassa), пробуем восстановить из памяти браузера
            userIdFromApp = localStorage.getItem('saved_user_id');
            appReturnUrl = localStorage.getItem('saved_app_return');
        }

        // Проверяем наличие ID
        if (userIdFromApp) {
            authStatusElement.textContent = "Пользователь успешно авторизован!";
            authStatusElement.style.color = "#28a745";
            
            payButton.disabled = false;
        } else {
            authStatusElement.textContent = "Ошибка: ID пользователя не найден. Откройте страницу из приложения.";
            authStatusElement.style.color = "#dc3545";
        }

        // Обработка клика по кнопке оплаты
        payButton.addEventListener('click', async () => {
            if (!userIdFromApp) {
                alert("Пользователь не авторизован!");
                return;
            }

            payButton.disabled = true;
            payButton.textContent = "Создание платежа...";

            try {
                const response = await fetch('/api/pay', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        amount: "49.99",
                        description: "поддержка разработчика",
                        userId: userIdFromApp,
                        returnUrl: appReturnUrl || "https://yookassaproj201514.vercel.app/"
                    })
                });

                const data = await response.json();

                if (response.ok && data.confirmation_url) {
                    window.location.href = data.confirmation_url;
                } else {
                    alert('Ошибка создания платежа: ' + (data.error || 'Неизвестная ошибка'));
                    payButton.disabled = false;
                    payButton.textContent = "поддержка разработчика";
                }
            } catch (error) {
                console.error('Ошибка сети:', error);
                alert('Произошла ошибка при соединении с сервером.');
                payButton.disabled = false;
                payButton.textContent = "поддержка разработчика";
            }
        });
    </script>
</body>
</html>
