<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- CHANGED -->
    <title>Оформление подписки</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h2 { margin-bottom: 20px; color: #333; }
        .price-box { margin: 20px 0; font-size: 18px; color: #444; }
        
        .amount-selector { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .amount-btn { padding: 10px 16px; border: 1px solid #ff8c00; background: white; color: #ff8c00; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .amount-btn.active { background: #ff8c00; color: white; }

        .price { font-weight: bold; color: #28a745; }
        button#payButton { width: 100%; padding: 12px; background-color: #ff8c00; color: white; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.3s; }
        button#payButton:disabled { background-color: #cccccc; cursor: not-allowed; }
        button#payButton:hover:not(:disabled) { background-color: #e07b00; }
    </style>
</head>
<body>

    <div class="container">
        <!-- CHANGED -->
        <h2>Оформление подписки</h2>
        
        <!-- NEW: Выбор тарифного плана подписки -->
        <div class="amount-selector">
            <button class="amount-btn active" data-amount="199.00" data-period="1_month">1 месяц</button>
            <button class="amount-btn" data-amount="990.00" data-period="1_year">1 год</button>
        </div>
        
        <div class="price-box">
            <!-- CHANGED -->
            Стоимость подписки: <span class="price" id="displayAmount">199.00</span> ₽
        </div>

        <!-- CHANGED -->
        <button id="payButton">Оформить подписку</button>
    </div>

    <script>
        const payButton = document.getElementById('payButton');
        const displayAmount = document.getElementById('displayAmount');
        let currentAmount = "199.00";
        let currentPeriod = "1_month";

        // NEW: Извлечение user_id из URL
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('user_id') || "";

        function updateSelection(amount, period, clickedElement) {
            currentAmount = amount;
            currentPeriod = period;
            displayAmount.textContent = amount;
            document.querySelectorAll('.amount-btn').forEach(b => b.classList.remove('active'));
            if (clickedElement) clickedElement.classList.add('active');
        }

        document.querySelectorAll('.amount-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                updateSelection(
                    btn.getAttribute('data-amount'), 
                    btn.getAttribute('data-period'), 
                    btn
                );
            });
        });

        payButton.addEventListener('click', async () => {
            if (!userId) {
                alert('Ошибка: пользователь не идентифицирован. Авторизуйтесь в приложении.');
                return;
            }

            payButton.disabled = true;
            // CHANGED
            payButton.textContent = "Создание подписки...";

            try {
                const response = await fetch('/api/pay', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        amount: currentAmount,
                        // CHANGED
                        description: `Подписка на приложение (${currentPeriod})`,
                        metadata: {
                            // NEW: Важные метаданные для привязки подписки
                            user_id: userId,
                            subscription_period: currentPeriod,
                            is_subscription: true
                        },
                        returnUrl: "https://yookassaproj201514.vercel.app/success"
                    })
                });

                const data = await response.json();

                if (response.ok && data.confirmation_url) {
                    window.location.href = data.confirmation_url;
                } else {
                    alert('Ошибка: ' + (data.error || 'Неизвестная ошибка'));
                    payButton.disabled = false;
                    // CHANGED
                    payButton.textContent = "Оформить подписку";
                }
            } catch (error) {
                console.error('Ошибка сети:', error);
                alert('Ошибка соединения.');
                payButton.disabled = false;
                // CHANGED
                payButton.textContent = "Оформить подписку";
            }
        });
    </script>
</body>
</html>
