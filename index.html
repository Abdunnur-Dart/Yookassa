<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оплата подписки и Авторизация</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }
        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 15px;
        }
        .container {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 400px;
        }
        h2, h3 { color: #333; text-align: center; margin-top: 0; }
        p { color: #666; text-align: center; font-size: 14px; }
        input {
            display: block;
            margin-bottom: 10px;
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-size: 15px;
            font-weight: bold;
            color: white;
            margin-bottom: 8px;
        }
        #loginBtn { background-color: #007bff; }
        #registerBtn { background-color: #6c757d; }
        .pay-btn { background-color: #ff7000; margin-top: 10px; }
        .pay-btn:disabled { background-color: #ccc; cursor: not-allowed; }
        #authStatus { font-size: 13px; color: #007bff; text-align: center; margin-bottom: 15px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Блок авторизации -->
        <div class="card">
            <h3>Аккаунт</h3>
            <p id="authStatus">Проверка авторизации...</p>
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="loginPassword" placeholder="Пароль">
            <button id="loginBtn">Войти</button>
            <button id="registerBtn">Зарегистрироваться</button>
        </div>

        <!-- Блок оплаты -->
        <div class="card">
            <h2>Премиум-подписка</h2>
            <p>Доступ ко всем возможностям за <strong>299.00 ₽</strong></p>
            <button id="payButton" class="pay-btn" disabled>Купить (требуется вход)</button>
        </div>
    </div>

    <!-- Подключаем логику как модуль -->
    <script type="module" src="./auth.js"></script>
</body>
</html>
