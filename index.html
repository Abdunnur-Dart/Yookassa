<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>поддержка разработчику</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h2 {
            margin-bottom: 20px;
            color: #333;
        }
        .price-box {
            margin: 20px 0;
            font-size: 18px;
            color: #444;
        }
        .price {
            font-weight: bold;
            color: #28a745;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #ff8c00;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        button:hover:not(:disabled) {
            background-color: #e07b00;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>поддержка разработчику</h2>
        
        <div class="price-box">
            поддержка разработчика за <span class="price">49.99 ₽</span>
        </div>

        <button id="payButton">поддержать разработчика</button>
    </div>

    <script>
        const payButton = document.getElementById('payButton');

        // Обработка клика по кнопке оплаты
        payButton.addEventListener('click', async () => {
            payButton.disabled = true;
            payButton.textContent = "Создание платежа...";

            try {
                const response = await fetch('/api/pay', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        amount: "49.99",
                        description: "поддержка разработчика",
                        returnUrl: "https://yookassaproj201514.vercel.app/success"
                    })
                });

                const data = await response.json();

                if (response.ok && data.confirmation_url) {
                    window.location.href = data.confirmation_url;
                } else {
                    alert('Ошибка создания платежа: ' + (data.error || 'Неизвестная ошибка'));
                    payButton.disabled = false;
                    payButton.textContent = "поддержать разработчика";
                }
            } catch (error) {
                console.error('Ошибка сети:', error);
                alert('Произошла ошибка при соединении с сервером.');
                payButton.disabled = false;
                payButton.textContent = "поддержать разработчика";
            }
        });
    </script>
</body>
</html>
