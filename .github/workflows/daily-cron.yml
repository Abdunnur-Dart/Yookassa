name: Daily Subscription Expire Cron

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  expire-subscriptions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: ./api/package-lock.json

      # Устанавливаем зависимости из папки api
      - name: Install Dependencies
        working-directory: ./api
        run: npm ci

      # Запускаем скрипт из корневой папки, подключая node_modules из api
      - name: Run Expire Script
        env:
          SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          NODE_PATH: ./api/node_modules
        run: |
          echo "$SERVICE_ACCOUNT_KEY" > serviceAccountKey.json
          node expire-subscriptions.js
          rm -f serviceAccountKey.json
