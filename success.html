<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Квитанция об оплате</title>
    <style>
        /* Базовые стили и сброс */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            background: linear-gradient(135deg, #eef2f5 0%, #e4e9ed 100%);
        }

        /* Анимация появления чека */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Карточка чека */
        .receipt-card {
            background: #fffdf9;
            padding: 35px 30px 25px 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06), 0 4px 12px rgba(0, 0, 0, 0.04);
            max-width: 400px;
            width: 100%;
            box-sizing: border-box;
            position: relative;
            border-bottom: 5px solid #fffdf9;
            border-radius: 12px 12px 0 0;
            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        /* Эффект зубчатого края чека снизу */
        .receipt-card::after {
            content: "";
            position: absolute;
            bottom: -10px;
            left: 0;
            width: 100%;
            height: 10px;
            background: linear-gradient(135deg, transparent 50%, #fffdf9 50%), 
                        linear-gradient(45deg, #fffdf9 50%, transparent 50%);
            background-size: 16px 20px;
        }

        /* Иконка успеха */
        .success-icon {
            display: block;
            margin: 0 auto 15px auto;
            color: #10b981;
        }

        h2 {
            color: #0f172a;
            text-align: center;
            margin: 0 0 8px 0;
            font-size: 24px;
            font-weight: 700;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            margin: 0 0 25px 0;
            line-height: 1.4;
        }

        /* Блок с деталями (имитация кассовой ленты) */
        .receipt-details {
            border-top: 2px dashed #cbd5e1;
            border-bottom: 2px dashed #cbd5e1;
            padding: 20px 0;
            margin: 20px 0;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            color: #334155;
        }

        .receipt-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            align-items: baseline;
        }

        .receipt-row span:first-child {
            color: #64748b;
            padding-right: 10px;
            white-space: nowrap;
        }

        .receipt-row span:last-child {
            font-weight: bold;
            text-align: right;
            word-break: break-all; /* Защита от переполнения длинными ID */
            max-width: 65%;
        }

        .status-paid {
            color: #10b981;
            font-weight: bold;
        }

        /* Итоговая сумма */
        .total {
            font-size: 18px;
            font-weight: bold;
            margin-top: 15px;
            border-top: 1px dashed #e2e8f0;
            padding-top: 15px;
            color: #0f172a;
        }

        /* Кнопка */
        .home-btn {
            background-color: #4f46e5;
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background-color 0.2s, transform 0.1s;
            margin-top: 30px;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.15);
        }

        .home-btn:hover {
            background-color: #4338ca;
        }

        .home-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <article class="receipt-card">
        <!-- SVG Иконка успешной оплаты -->
        <svg class="success-icon" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
            <polyline points="22 4 12 14.01 9 11.01"></polyline>
        </svg>

        <h2>Оплата успешна!</h2>
        <p class="subtitle">Спасибо за поддержку разработчика</p>
        
        <section class="receipt-details">
            <div class="receipt-row">
                <span>№ чека:</span>
                <span id="receiptId">Загрузка...</span>
            </div>
            <div class="receipt-row">
                <span>Дата и время:</span>
                <span id="receiptDate">Загрузка...</span>
            </div>
            <div class="receipt-row">
                <span>Услуга:</span>
                <span>поддержка проекта</span>
            </div>
            <div class="receipt-row">
                <span>Статус:</span>
                <span class="status-paid">Оплачено</span>
            </div>
            <div class="receipt-row total">
                <span>Итого:</span>
                <span>49.99 RUB</span>
            </div>
        </section>

        <a href="#" class="home-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            На главную
        </a>
    </article>

    <script>
        // 1. Получаем параметр payment_id из URL (например: ?payment_id=27d9a70d-000f-5000-8000-1178635848bb)
        const urlParams = new URLSearchParams(window.location.search);
        const realPaymentId = urlParams.get('payment_id');
        const receiptIdElem = document.getElementById('receiptId');

        if (realPaymentId) {
            receiptIdElem.textContent = realPaymentId;
            // Слегка уменьшаем шрифт для длинных идентификаторов ЮKassa
            receiptIdElem.style.fontSize = '11px'; 
        } else {
            // Резервный номер, если страницу открыли без параметров
            receiptIdElem.textContent = '#T-' + Math.floor(100000 + Math.random() * 900000);
        }

        // 2. Генерируем актуальную дату и время оплаты
        const now = new Date();
        const formattedDate = now.toLocaleDateString('ru-RU') + ' ' + now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
        document.getElementById('receiptDate').textContent = formattedDate;
    </script>

</body>
</html>
