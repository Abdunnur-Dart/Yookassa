<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Квитанция об оплате</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }
        /* По умолчанию карточка скрыта — пользователь видит белый экран */
        .receipt-card {
            display: none; 
            background: #fffdf9;
            padding: 35px 25px 30px 25px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            max-width: 400px;
            width: 100%;
            box-sizing: border-box;
            position: relative;
            border-bottom: 5px solid #fffdf9;
        }
        .receipt-card::after {
            content: "";
            position: absolute;
            bottom: -10px;
            left: 0;
            width: 100%;
            height: 10px;
            background: linear-gradient(135deg, transparent 50%, #fffdf9 50%), linear-gradient(45deg, #fffdf9 50%, transparent 50%);
            background-size: 16px 20px;
        }
        h2 {
            color: #28a745;
            text-align: center;
            margin-top: 0;
        }
        .subtitle {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .receipt-details {
            border-top: 2px dashed #d5d5d5;
            border-bottom: 2px dashed #d5d5d5;
            padding: 15px 0;
            margin: 20px 0;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            color: #333;
        }
        .receipt-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .receipt-row span:last-child {
            font-weight: bold;
            text-align: right;
        }
        .total {
            font-size: 16px;
            font-weight: bold;
            margin-top: 12px;
            border-top: 1px solid #eee;
            padding-top: 10px;
        }
        .home-btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            display: block;
            text-align: center;
            transition: background 0.3s;
            margin-top: 25px;
        }
        .home-btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="receipt-card" id="receiptCard">
        <h2>Оплата успешна!</h2>
        <p class="subtitle">Спасибо за поддержку разработчика</p>
        
        <div class="receipt-details">
            <div class="receipt-row">
                <span>№ чека:</span>
                <span id="receiptId">Загрузка...</span>
            </div>
            <div class="receipt-row">
                <span>Дата и время:</span>
                <span id="receiptDate">Загрузка...</span>
            </div>
            <div class="receipt-row">
                <span>Услуга:</span>
                <span>поддержка разработчика</span>
            </div>
            <div class="receipt-row">
                <span>Статус:</span>
                <span style="color: #28a745;">Оплачено</span>
            </div>
            <div class="receipt-row total">
                <span>Сумма:</span>
                <span>49.99 RUB</span>
            </div>
        </div>

        <a href="https://yookassaproj201514.vercel.app/" class="home-btn">На главную</a>
    </div>

    <script>
        // Проверяем, есть ли сохраненный ID активного платежа
        const paymentId = localStorage.getItem('active_payment_id');

        if (paymentId) {
            // Если ID найден — делаем чек видимым
            document.getElementById('receiptCard').style.display = 'block';

            // Генерируем актуальную дату и время оплаты
            const now = new Date();
            const formattedDate = now.toLocaleDateString('ru-RU') + ' ' + now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
            document.getElementById('receiptDate').textContent = formattedDate;

            // Выводим номер чека на основе ID платежа
            document.getElementById('receiptId').textContent = '#T-' + paymentId.slice(-6);

            // Удаляем ключ, чтобы при повторном обновлении или визите без оплаты был пустой экран
            localStorage.removeItem('active_payment_id');
        }
        // Если paymentId нет, блок остается скрытым (пользователь видит белый экран)
    </script>

</body>
</html>
