<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оплата успешна!</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            background: linear-gradient(135deg, #eef2f5 0%, #e4e9ed 100%);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .receipt-card {
            background: #fffdf9;
            padding: 35px 30px 25px 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06), 0 4px 12px rgba(0, 0, 0, 0.04);
            max-width: 400px;
            width: 100%;
            box-sizing: border-box;
            position: relative;
            border-bottom: 5px solid #fffdf9;
            border-radius: 12px 12px 0 0;
            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
            text-align: center;
        }

        .receipt-card::after {
            content: "";
            position: absolute;
            bottom: -10px;
            left: 0;
            width: 100%;
            height: 10px;
            background: linear-gradient(135deg, transparent 50%, #fffdf9 50%), 
                        linear-gradient(45deg, #fffdf9 50%, transparent 50%);
            background-size: 16px 20px;
        }

        .success-icon {
            display: block;
            margin: 0 auto 15px auto;
            color: #10b981;
        }

        h2 {
            color: #0f172a;
            margin: 0 0 8px 0;
            font-size: 24px;
            font-weight: 700;
        }

        .subtitle {
            color: #64748b;
            font-size: 14px;
            margin: 0 0 15px 0;
            line-height: 1.4;
        }

        .redirect-status {
            background-color: #f0fdf4;
            border: 1px solid #bbf7d0;
            color: #166534;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .receipt-details {
            border-top: 2px dashed #cbd5e1;
            border-bottom: 2px dashed #cbd5e1;
            padding: 20px 0;
            margin: 20px 0;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            color: #334155;
            text-align: left;
        }

        .receipt-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            align-items: baseline;
        }

        .receipt-row span:first-child {
            color: #64748b;
            padding-right: 10px;
            white-space: nowrap;
        }

        .receipt-row span:last-child {
            font-weight: bold;
            text-align: right;
            word-break: break-all;
            max-width: 65%;
        }

        .status-paid {
            color: #10b981;
            font-weight: bold;
        }

        .total {
            font-size: 18px;
            font-weight: bold;
            margin-top: 15px;
            border-top: 1px dashed #e2e8f0;
            padding-top: 15px;
            color: #0f172a;
        }

        .home-btn {
            background-color: #ff8c00;
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background-color 0.2s, transform 0.1s;
            margin-top: 25px;
            box-shadow: 0 4px 12px rgba(255, 140, 0, 0.2);
        }

        .home-btn:hover {
            background-color: #e07b00;
        }

        .home-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <article class="receipt-card">
        <svg class="success-icon" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
            <polyline points="22 4 12 14.01 9 11.01"></polyline>
        </svg>

        <h2>Оплата успешна!</h2>
        <p class="subtitle">Спасибо за приобретение подписки</p>

        <!-- Блок информирования о перенаправлении -->
        <div class="redirect-status">
            <span>Перенаправляем в приложение через <span id="countdown">3</span> сек...</span>
        </div>
        
        <section class="receipt-details">
            <div class="receipt-row">
                <span>№ заказа:</span>
                <span id="receiptId">Загрузка...</span>
            </div>
            <div class="receipt-row">
                <span>Дата и время:</span>
                <span id="receiptDate">Загрузка...</span>
            </div>
            <div class="receipt-row">
                <span>Услуга:</span>
                <span>Премиум подписка</span>
            </div>
            <div class="receipt-row">
                <span>Статус:</span>
                <span class="status-paid">Оплачено</span>
            </div>
            <div class="receipt-row total">
                <span>Итого:</span>
                <span id="receiptAmount">199.00 RUB</span>
            </div>
        </section>

        <!-- Кнопка ручного возврата в приложение -->
        <a href="javascript:void(0);" id="appLink" class="home-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                <polyline points="15 3 21 3 21 9"></polyline>
                <line x1="10" y1="14" x2="21" y2="3"></line>
            </svg>
            Вернуться в приложение
        </a>
    </article>

    <script>
        // 1. Считываем параметры из URL
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('order_id');
        const amount = urlParams.get('amount');
        const receiptIdElem = document.getElementById('receiptId');
        const receiptAmountElem = document.getElementById('receiptAmount');

        if (orderId) {
            receiptIdElem.textContent = orderId;
            if (orderId.length > 15) {
                receiptIdElem.style.fontSize = '12px'; 
            }
        } else {
            receiptIdElem.textContent = '#ORD-' + Math.floor(100000 + Math.random() * 900000);
        }

        if (amount) {
            receiptAmountElem.textContent = `${amount} RUB`;
        }

        // 2. Устанавливаем текущую дату
        const now = new Date();
        const formattedDate = now.toLocaleDateString('ru-RU') + ' ' + now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
        document.getElementById('receiptDate').textContent = formattedDate;

        // 3. Настройка Deep Link редиректа в приложение
        // Замените "mualim://" на вашу схему диплинка во Flutter (или универсальную ссылку), если она есть
        const appDeepLink = "mualim://success"; 
        const appLinkBtn = document.getElementById('appLink');

        function openApp() {
            // Попытка открыть приложение через Deep Link
            window.location.href = appDeepLink;

            // Если открыто во встроенном WebView на мобильном устройстве, пытаемся закрыть вкладку
            setTimeout(() => {
                if (window.history.length > 1) {
                    window.history.back();
                }
            }, 1000);
        }

        appLinkBtn.addEventListener('click', openApp);

        // 4. Логика обратного отсчета
        let secondsLeft = 3;
        const countdownElem = document.getElementById('countdown');

        const timer = setInterval(() => {
            secondsLeft--;
            if (countdownElem) countdownElem.textContent = secondsLeft;

            if (secondsLeft <= 0) {
                clearInterval(timer);
                openApp();
            }
        }, 1000);
    </script>

</body>
</html>
