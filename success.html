<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Квитанция об оплате</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }
        .receipt-card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
            box-sizing: border-box;
        }
        h2 {
            color: #28a745;
            text-align: center;
            margin-top: 0;
        }
        .subtitle {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .receipt-details {
            border-top: 2px dashed #ddd;
            border-bottom: 2px dashed #ddd;
            padding: 15px 0;
            margin: 20px 0;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            color: #333;
        }
        .receipt-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .receipt-row span:last-child {
            font-weight: bold;
            text-align: right;
        }
        .total {
            font-size: 16px;
            font-weight: bold;
            margin-top: 12px;
            border-top: 1px solid #eee;
            padding-top: 10px;
        }
        .home-btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            display: block;
            text-align: center;
            transition: background 0.3s;
        }
        .home-btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="receipt-card">
        <h2>Оплата успешна!</h2>
        <p class="subtitle">Спасибо за поддержку разработчика</p>
        
        <div class="receipt-details">
            <div class="receipt-row">
                <span>№ чека:</span>
                <span id="receiptId">Загрузка...</span>
            </div>
            <div class="receipt-row">
                <span>Дата и время:</span>
                <span id="receiptDate">Загрузка...</span>
            </div>
            <div class="receipt-row">
                <span>Услуга:</span>
                <span>поддержка разработчика</span>
            </div>
            <div class="receipt-row">
                <span>Статус:</span>
                <span style="color: #28a745;">Оплачено</span>
            </div>
            <div class="receipt-row total">
                <span>Сумма:</span>
                <span>49.99 RUB</span>
            </div>
       
 <span>можете возвращатся в приложение</span>
    <script>
        // Генерируем актуальную дату и время оплаты
        const now = new Date();
        const formattedDate = now.toLocaleDateString('ru-RU') + ' ' + now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
        document.getElementById('receiptDate').textContent = formattedDate;

        // Генерируем уникальный номер чека для отображения
        const randomReceiptNum = '#T-' + Math.floor(100000 + Math.random() * 900000);
        document.getElementById('receiptId').textContent = randomReceiptNum;
    </script>

</body>
</html>
