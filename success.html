<!-- success.html -->
<div class="receipt-card" id="receipt">
    <h2>Ваш чек</h2>
    <div class="receipt-details">
        <div class="receipt-row"><span>ID платежа:</span> <span id="pId">Проверка...</span></div>
        <div class="receipt-row"><span>Статус:</span> <span id="pStatus" style="color:red">Не подтвержден</span></div>
        <div class="receipt-row"><span>Дата:</span> <span id="pDate">-</span></div>
        <div class="receipt-row total"><span>Итого:</span> <span>299.00 RUB</span></div>
    </div>
</div>

<script>
    // Получаем ID платежа из URL: ?payment_id=...
    const urlParams = new URLSearchParams(window.location.search);
    const paymentId = urlParams.get('payment_id');

    if (paymentId) {
        document.getElementById('pId').textContent = paymentId;
        // Здесь должен быть fetch('/api/check-status?id=' + paymentId) 
        // который на сервере проверяет статус через API ЮKassa
        document.getElementById('pStatus').textContent = "Оплачено (Проверено)";
        document.getElementById('pStatus').style.color = "green";
        document.getElementById('pDate').textContent = new Date().toLocaleString();
    } else {
        document.getElementById('receipt').innerHTML = "<h3>Ошибка: данные платежа не найдены.</h3><p>Пожалуйста, используйте кнопку оплаты на главной странице.</p>";
    }
</script>
